services:
  gx-daemon:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-Asia/Seoul}
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
        DOCKER_GID: ${DOCKER_GID}
    image: gx-daemon:latest
    container_name: ${APP_ENV:-prod}-gx-daemon
    restart: unless-stopped

    env_file:
      - path: .env
        required: true

    command: /bin/sh -c "uvicorn app.main:app --host 0.0.0.0 --port $${APP_PORT:-8000} --no-access-log"

    ports:
      - "${HOST_PORT:-8000}:${APP_PORT:-8000}"

    user: "${HOST_UID}:${HOST_GID}"
    group_add:
      - "${DOCKER_GID}"

    volumes:
      - ./app:/app/app:ro
      - ./data/report_templates:/app/data/report_templates:ro
      - ./data/nipt_report_html:/app/data/nipt_report_html:ro
      - ${BASE_DIR:-/data}:/data
      - ${CARRIER_SCREENING_HOST:-/home/ken/gx-exome}:/data/gx-exome
      - ${CARRIER_SCREENING_HOST:-/home/ken/gx-exome}:${CARRIER_SCREENING_HOST:-/home/ken/gx-exome}
      - ${BASE_DIR:-/data}/reference:/data/reference:ro
      - ${CARRIER_SCREENING_PIPELINE_DIR:-/opt/pipelines/carrier-screening}:/opt/pipelines/carrier-screening:ro
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:$${APP_PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
